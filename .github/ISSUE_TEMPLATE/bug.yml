name: Bug
description: Something is broken, behaves incorrectly, or does not match the expected behavior
title: "[Bug] "
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Use this template for bugs, regressions, unexpected behavior or broken functionality.

        Planning fields such as Product Area, Priority, Status, Release Phase, Severity and Target Date should be maintained in the GitHub Project board.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the problem.
      placeholder: |
        Example:
        The daily check-in confirmation is not stored after the user taps the check-in button.
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: Current Behavior
      description: What currently happens?
      placeholder: |
        Describe the incorrect or unexpected behavior.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What should happen instead?
      placeholder: |
        Describe the correct behavior.
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: How can the problem be reproduced?
      placeholder: |
        1. Go to ...
        2. Tap/click ...
        3. Enter ...
        4. See error ...
    validations:
      required: true

  - type: textarea
    id: affected_area
    attributes:
      label: Affected Area
      description: Which area seems affected?
      placeholder: |
        Example:
        UI, Backend, Batch, Notifications, Payments, Database, Infrastructure, Security, Other.
        
        Use the Project Board field for filterable classification.
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where did this happen?
      placeholder: |
        - App / service:
        - Environment: dev / staging / production
        - Browser:
        - Device:
        - OS:
        - App version:
        - User role:
    validations:
      required: false

  - type: textarea
    id: logs_or_error
    attributes:
      label: Logs / Error Message
      description: Add relevant logs, error messages, screenshots or stack traces.
      placeholder: |
        Paste logs, errors or screenshots here.
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What is the user or business impact?
      placeholder: |
        Example:
        Users cannot complete the check-in flow.
        Emergency contacts are not notified.
        Admin cannot access the dashboard.
    validations:
      required: false

  - type: textarea
    id: suspected_cause
    attributes:
      label: Suspected Cause
      description: Optional technical hypothesis.
      placeholder: |
        Example:
        Might be related to the latest API change / migration / background job / deployment.
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Is there a temporary workaround?
      placeholder: |
        Example:
        User can refresh the page and try again.
        Admin can trigger the job manually.
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: When is this bug considered fixed?
      placeholder: |
        - [ ] Root cause identified
        - [ ] Bug fixed
        - [ ] Regression test added or documented where useful
        - [ ] Fix verified in relevant environment
        - [ ] No related side effects observed
    validations:
      required: true

  - type: textarea
    id: related_items
    attributes:
      label: Related Issues / Pull Requests
      description: Link related issues, PRs or incidents.
      placeholder: |
        - Related to #...
        - Caused by #...
        - Fixed by #...
    validations:
      required: false
